<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>员工与额度 · Lumen</title>
    <link rel="stylesheet" href="/__host/commerce.css" />
    <script src="/__host/resource-operations.js" defer></script>
  </head>
  <body>
    <header>
      <div class="wrap bar">
        <a class="brand" href="/"><b>L</b> Lumen 资源中心</a>
        <nav aria-label="主导航">
          <a href="/__host/shop">资源市场</a><a href="/__host/wallet">我的钱包</a
          ><a aria-current="page" href="/__host/accounts">员工与额度</a><a href="/">员工工作台</a>
        </nav>
        <details class="profile-menu">
          <summary>账户</summary>
          <div>
            <a href="/__host/security">支付密码</a><a href="/__host/payment-review">收款核对</a
            ><a href="/signout-with-chatgpt">退出登录</a>
          </div>
        </details>
      </div>
    </header>
    <main class="wrap">
      <div class="heading-row">
        <div>
          <h1>员工与额度</h1>
          <p class="hint">创建公司员工账号，按需增加其可用余额。</p>
        </div>
        <button type="button" id="new-employee">创建员工</button>
      </div>
      <p id="account-status" role="status" aria-live="polite"></p>
      <section class="history">
        <div class="accounts-toolbar">
          <div class="history-tabs" aria-label="账号类型">
            <button type="button" data-role="employee" aria-pressed="true">员工</button
            ><button type="button" data-role="all" aria-pressed="false">全部账号</button>
          </div>
          <label class="search-label" aria-label="搜索账号"
            ><input id="account-search" type="search" placeholder="搜索姓名或邮箱" aria-label="搜索姓名或邮箱"
          /></label>
        </div>
        <div class="table-wrap">
          <table class="billing-table accounts-table">
            <thead>
              <tr>
                <th scope="col">账号</th>
                <th scope="col">身份</th>
                <th scope="col">可用余额</th>
                <th scope="col">操作</th>
              </tr>
            </thead>
            <tbody id="account-list"></tbody>
          </table>
          <p id="empty-accounts" class="empty-state">正在读取账号…</p>
        </div>
      </section>
      <dialog id="employee-dialog" aria-labelledby="employee-title">
        <div class="dialog-head">
          <h2 id="employee-title">创建员工</h2>
          <button type="button" data-close="employee-dialog" aria-label="关闭">×</button>
        </div>
        <form id="create-employee" autocomplete="off">
          <label>员工姓名<input name="name" maxlength="80" required /></label
          ><label>登录邮箱<input name="email" type="email" maxlength="254" required /></label
          ><label
            >初始密码<input
              name="password"
              type="password"
              minlength="12"
              maxlength="128"
              required
              autocomplete="new-password"
            /><small>至少 12 位</small></label
          >
          <p class="modal-feedback" role="status" hidden></p>
          <button>创建员工账号</button>
        </form>
      </dialog>
      <dialog id="credit-dialog" aria-labelledby="credit-title">
        <div class="dialog-head">
          <h2 id="credit-title">增加额度</h2>
          <button type="button" data-close="credit-dialog" aria-label="关闭">×</button>
        </div>
        <p class="credit-target" id="credit-account"></p>
        <form id="credit-form">
          <label
            >增加金额（U）<input
              type="number"
              min="0.0001"
              max="99999999.9999"
              step="0.0001"
              name="amount"
              inputmode="decimal"
              required /></label
          ><label>入账备注<input name="note" value="账户额度" maxlength="180" required /></label>
          <p id="credit-result" class="hint"></p>
          <p class="modal-feedback" role="status" hidden></p>
          <button>确认增加额度</button>
        </form>
      </dialog>
    </main>
  </body>
</html>
