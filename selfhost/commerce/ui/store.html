<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>账户与资源市场 · Lumen</title>
    <link rel="stylesheet" href="/__host/commerce.css" />
    <script src="/__host/commerce.js" defer></script>
  </head>
  <body>
    <header>
      <div class="wrap bar">
        <a class="brand" href="/"><b>L</b> Lumen 资源中心</a>
        <nav aria-label="主导航">
          <a href="/__host/shop">资源市场</a><a href="/__host/wallet">我的钱包</a
          ><a href="/__host/accounts" id="staff-admin-link" hidden>员工与额度</a>
          <a href="/" id="workspace" hidden>员工工作台</a>
        </nav>
        <details class="profile-menu">
          <summary>账户</summary>
          <div>
            <p id="account"></p>
            <a href="/__host/security">支付密码</a
            ><a id="review-link" href="/__host/payment-review" hidden>收款核对</a>
            <a href="/signout-with-chatgpt">退出登录</a>
          </div>
        </details>
      </div>
    </header>
    <main class="wrap">
      <h1 id="title">我的钱包</h1>
      <p id="notice" role="status" aria-live="polite"></p>
      <div id="wallet" hidden>
        <section class="wallet-balance" aria-label="可用余额">
          <div>
            <h2>可用余额</h2>
            <div class="balance-number"><strong id="balance">—</strong><span>U</span></div>
            <p class="held" id="held" hidden></p>
          </div>
          <button id="recharge" type="button" hidden>充值 USDT</button>
        </section>
        <section class="history">
          <div class="history-tabs" aria-label="选择账单类型">
            <button type="button" id="show-entries" aria-pressed="true">余额明细</button>
            <button type="button" id="show-deposits" aria-pressed="false" hidden>充值记录</button>
          </div>
          <div class="table-wrap" id="entries"></div>
          <div class="table-wrap" id="deposits" hidden></div>
        </section>
        <dialog id="deposit-dialog" aria-labelledby="deposit-title">
          <div class="dialog-head">
            <h2 id="deposit-title">充值 USDT</h2>
            <button type="button" data-close="deposit-dialog" aria-label="关闭">×</button>
          </div>
          <form id="deposit-form">
            <label>入账金额（U）<input name="amount" type="number" step="1" min="5" value="50" required /></label>
            <div class="presets" aria-label="常用充值金额">
              <button type="button" data-amount="5">5 U</button><button type="button" data-amount="20">20 U</button
              ><button type="button" data-amount="50">50 U</button
              ><button type="button" data-amount="100">100 U</button>
            </div>
            <label>支付网络<select name="network" required></select></label>
            <p class="hint">最低 5 U。请按下一步显示的精确金额转账。</p>
            <p class="modal-feedback" role="status" hidden></p>
            <button type="submit">获取收款二维码</button>
          </form>
        </dialog>
        <dialog id="invoice" aria-labelledby="invoice-title">
          <div class="dialog-head">
            <h2 id="invoice-title">充值详情</h2>
            <button type="button" data-close="invoice" aria-label="关闭">×</button>
          </div>
          <div id="invoice-data"></div>
          <p class="modal-feedback" role="status" hidden></p>
        </dialog>
      </div>
      <div id="security" hidden>
        <section class="settings-card">
          <form id="pin-form">
            <label
              >原支付密码<input
                name="currentPin"
                type="password"
                pattern="[0-9]{6}"
                maxlength="6"
                inputmode="numeric"
                autocomplete="off"
              /><small>首次设置可留空</small></label
            >
            <label
              >新的六位支付密码<input
                name="newPin"
                type="password"
                pattern="[0-9]{6}"
                maxlength="6"
                inputmode="numeric"
                autocomplete="new-password"
                required
            /></label>
            <button>保存支付密码</button>
          </form>
        </section>
      </div>
      <div id="payment-review" hidden>
        <section>
          <h2>收款网络</h2>
          <div id="health"></div>
        </section>
        <section>
          <h2>待核对转账</h2>
          <div id="reviews"></div>
        </section>
      </div>
      <div id="shop" hidden>
        <nav class="tabs">
          <a href="#catalog">eSIM 套餐</a><a href="#address">地址生成</a><a href="#orders">我的订单</a>
        </nav>
        <section id="catalog">
          <h2>eSIM 流量套餐</h2>
          <form class="inline" id="search">
            <label>搜索套餐、国家或运营商<input name="q" type="search" placeholder="例如 Singapore" /></label
            ><button>搜索</button>
          </form>
          <div id="products"></div>
          <div class="buttons">
            <button id="prev" class="secondary">上一页</button><button id="next" class="secondary">下一页</button>
          </div>
        </section>
        <section id="address">
          <div class="address-price">
            <h2>地址证明生成</h2>
            <strong>10 <small>U / 份</small></strong>
          </div>
          <details id="address-details">
            <summary>填写订单</summary>
            <form id="address-form">
              <label>模板<select name="template" required></select></label
              ><label>英文姓名<input name="name" required maxlength="120" autocomplete="off" /></label
              ><label>地址第 1 行<input name="line1" required maxlength="160" autocomplete="off" /></label
              ><label>地址第 2 行<input name="line2" maxlength="160" autocomplete="off" /></label
              ><label>地址第 3 行<input name="line3" maxlength="160" autocomplete="off" /></label
              ><label>接收邮箱<input name="email" type="email" required autocomplete="off" /></label
              ><label
                >支付密码<input
                  name="pin"
                  type="password"
                  inputmode="numeric"
                  pattern="[0-9]{6}"
                  maxlength="6"
                  required
              /></label>
              <p class="hint">付款后开始生成。若订单处理失败，10 U 将退回账户余额。</p>
              <a href="/__host/security">设置支付密码</a>
              <button>支付 10 U 并生成</button>
            </form>
          </details>
        </section>
        <section id="orders">
          <h2>我的订单</h2>
          <button id="refresh-orders" class="secondary">刷新订单</button>
          <div id="order-list"></div>
          <div id="order-details"></div>
        </section>
      </div>
      <dialog id="dialog">
        <form method="dialog">
          <h2 id="dialog-title"></h2>
          <div id="dialog-fields"></div>
          <div class="buttons">
            <button value="cancel" formnovalidate class="secondary">取消</button><button value="ok">确认</button>
          </div>
        </form>
      </dialog>
    </main>
  </body>
</html>
